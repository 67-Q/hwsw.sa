<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python 陣列小遊戲🎮</title>

<link rel="stylesheet" href="Codeing_game.css">
</head>

<body>
  <!-- ===================== 【區塊】標題列 ===================== -->
  <header>
    <h1>🎮 Python 陣列小遊戲</h1>
    <select id="examples" title="載入範例程式">
      <option value="">載入範例…</option>
      <optgroup label="跳躍（0 跳、1 走）">
        <option value="jump_L1">L1 改數字</option>
        <option value="jump_L2">L2 字串輸入</option>
        <option value="jump_L3">L3 迴圈走訪</option>
      </optgroup>
      <optgroup label="迷宮（w 上、s 下、a 左、d 右）">
        <option value="maze_L1">迷宮 L1 改數字</option>
        <option value="maze_L2">迷宮 L2 字串輸入</option>
      </optgroup>
    </select>
    <span id="status">載入 Python 中…</span>
    <button id="themeBtn" title="切換淺色／深色">🌙 深色</button>
    <button id="runBtn" disabled>▶ 執行 (Ctrl+Enter)</button>
    <button id="stopBtn">■ 停止</button>
    <button id="clearBtn">清除</button>
  </header>

  <div id="main">
    <!-- ===================== 【區塊】左半部（2/3）：遊戲畫面（上）＋ 文字輸出（下） ===================== -->
    <section id="left">
      <div id="graphWrap">
        <div class="label">遊戲畫面</div>
        <div id="mon"></div>
        <div id="stageBox">
          <svg id="stage" viewBox="0 0 620 300" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
        <div id="banner"></div>
      </div>
      <div class="hsplit" id="hsplit" title="上下拖曳調整高度"></div>
      <div id="outWrap">
        <div class="label">輸出結果</div>
        <pre id="out"></pre>
      </div>
    </section>

    <div class="vsplit" id="vsplit" title="左右拖曳調整寬度"></div>

    <!-- ===================== 【區塊】右半部（1/3）：Python 程式碼 ===================== -->
    <section id="right">
      <div class="label">Python 程式碼</div>
      <div id="editorHost">
<textarea id="code" spellcheck="false">import game

game.set_map([0, 1, 1, 1, 0, 1, 0, 0])   

moves = [0, 1, 1, 1, 0, 1, 0, 0]         
#改掉其中一個數字，角色會在第幾格失敗？

game.play(moves)
</textarea>
      </div>
    </section>
  </div>

<script src="Game_engine.js"></script>
<script src="Codeing_game.js"></script>
</body>
</html>
